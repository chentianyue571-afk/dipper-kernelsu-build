name: Build dipper kernel with official KernelSU (4.9 compatible)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source tree: ngk (NGK susfs, targets A13+ ROMs, untested on MIUI A10) or micode (MiCode dipper-q-oss, official MIUI Android 10 source, guaranteed A10 DTB match)"
        default: "ngk"
        required: false
      kernel_ref:
        description: "Kernel source branch/commit (NGK: susfs/dipper; micode: dipper-q-oss)"
        default: "susfs"
        required: false
      ksu_ref:
        description: "KernelSU tag (old-arch only: v3.0.0/v2.0.0/v1.0.0; main is new-arch and CANNOT build on 4.9)"
        default: "v3.0.0"
        required: false
      create_release:
        description: "Create release after build"
        default: "true"
        required: false

permissions:
  contents: write

env:
  KERNEL_REPO: mansiaer/NGK_android_kernel_xiaomi_sdm845
  CLANG_URL: >-
    https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/42d2c090c14c9c7f4dfd365ae551e2b959dc775c/clang-r584948b.tar.gz
  DEFCONFIG: nh-dipper_defconfig

jobs:
  build:
    name: Build dipper + KernelSU
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Resolve kernel source
        run: |
          if [ "${{ github.event.inputs.kernel_source }}" = "micode" ]; then
            echo "KERNEL_REPO=MiCode/Xiaomi_Kernel_OpenSource" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=${{ github.event.inputs.kernel_ref }}" >> $GITHUB_ENV
            echo "DEFCONFIG=dipper_user_defconfig" >> $GITHUB_ENV
            echo "LOCALVERSION=-MiCode-KSU" >> $GITHUB_ENV
            echo "KERNEL_STRING=MiCode dipper A10 official source + official KernelSU (MIUI A10)" >> $GITHUB_ENV
            # vanilla 4.9 kbuild: stack-protector prepare check misfires with
            # modern clang; integrated assembler breaks on old qcom asm.
            echo "IAS_FLAG=" >> $GITHUB_ENV
          else
            echo "KERNEL_REPO=mansiaer/NGK_android_kernel_xiaomi_sdm845" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=${{ github.event.inputs.kernel_ref }}" >> $GITHUB_ENV
            echo "DEFCONFIG=nh-dipper_defconfig" >> $GITHUB_ENV
            echo "LOCALVERSION=-NGK-KSU" >> $GITHUB_ENV
            echo "KERNEL_STRING=NGK dipper + official KernelSU (MIUI any)" >> $GITHUB_ENV
            echo "IAS_FLAG=LLVM_IAS=1" >> $GITHUB_ENV
          fi
          echo "Resolved: KERNEL_REPO=$KERNEL_REPO BRANCH=$KERNEL_BRANCH DEFCONFIG=$DEFCONFIG"

      - name: Checkout kernel source
        run: |
          git clone --depth=1 --branch "${KERNEL_BRANCH}" \
            "https://github.com/${KERNEL_REPO}.git" kernel
          cd kernel
          echo "kernel HEAD = $(git rev-parse HEAD)"
          echo "=== defconfig KSU/KPROBES before patch ==="
          grep -E "CONFIG_KPROBES|CONFIG_KSU|CONFIG_EXT4_FS=" arch/arm64/configs/${DEFCONFIG} || true

      - name: Patch defconfig (enable KPROBES, required by KSU)
        run: |
          cd kernel
          {
            echo ""
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_LOCALVERSION=\"${LOCALVERSION}\""
          } >> arch/arm64/configs/${DEFCONFIG}
          if [ "${{ github.event.inputs.kernel_source }}" = "micode" ]; then
            # 4.16-style Kconfig CHOICE (NONE/REGULAR/STRONG): appended
            # "# ... is not set" lines do not stick for choice members.
            # Rewrite the selection in place instead.
            sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y$/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' arch/arm64/configs/${DEFCONFIG}
            echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/${DEFCONFIG}
            # vanilla Kbuild.include probes with -Werror over the full
            # KBUILD_CFLAGS; 2019-era flags make modern clang warn, turning
            # EVERY cc-option probe (incl. stack-protector check) into a
            # failure. Drop -Werror from the probe only.
            # Drop -Werror from the probe line (line 115 = __cc-option body).
            sed -i '115s/-Werror//' scripts/Kbuild.include
            sed -n '114,115p' scripts/Kbuild.include
            # gcc>=10 defaults to -fno-common; legacy dtc host build hits
            # "multiple definition of 'yylloc'" when linking dtc.
            sed -i 's/-fomit-frame-pointer -std=gnu89$/-fomit-frame-pointer -std=gnu89 -fcommon/' Makefile
            grep -E "CC_STACKPROTECTOR" arch/arm64/configs/${DEFCONFIG}
          fi
          echo "=== defconfig after patch ==="
          grep -E "CONFIG_KPROBES=|CONFIG_KSU=|CONFIG_LOCALVERSION=" arch/arm64/configs/${DEFCONFIG}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev python3 lld zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Stage cross bin dir (old msm kbuild clang --prefix fix)
        run: |
          # msm-4.9 Makefile passes clang --prefix=<dir of $(CROSS_COMPILE)elfedit>
          # and resolves the EXTERNAL assembler as <dir>/as (-no-integrated-as).
          # On Ubuntu that dir is /usr/bin -> host x86 as ->
          # "as: unrecognized option '-EL'". Stage a dir where bare as/ld ARE
          # the aarch64 binutils and make `which aarch64-linux-gnu-elfedit`
          # resolve there, so --prefix points at aarch64 tools.
          sudo mkdir -p /opt/cross/bin
          for t in elfedit as ld; do
            sudo ln -sf /usr/bin/aarch64-linux-gnu-$t /opt/cross/bin/aarch64-linux-gnu-$t
          done
          # bare names: only as/ld (no gcc/ar/nm - those must stay host tools)
          sudo ln -sf /usr/bin/aarch64-linux-gnu-as /opt/cross/bin/as
          sudo ln -sf /usr/bin/aarch64-linux-gnu-ld /opt/cross/bin/ld
          ls -la /opt/cross/bin

      - name: Cache clang toolchain
        id: clang
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-r584948b

      - name: Download clang
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir clang
          curl -L --fail --retry 3 "${CLANG_URL}" -o clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz
          ./clang/bin/clang --version

      - name: Integrate official KernelSU (old-arch tag, 4.9 compatible)
        run: |
          cd kernel
          KSU_REF="${{ github.event.inputs.ksu_ref }}"
          curl -LSs --fail --retry 3 \
            "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_REF}/kernel/setup.sh" \
            -o setup_ksu.sh
          sh setup_ksu.sh "${KSU_REF}"
          echo "=== verify integration ==="
          test -f KernelSU/kernel/Makefile || test -f KernelSU/kernel/Kbuild || { echo "::error::KernelSU source not present"; exit 1; }
          grep -q "kernelsu" drivers/Makefile || { echo "::error::drivers/Makefile not patched by setup.sh"; exit 1; }
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || {
            echo "Kconfig entry missing, adding it manually"
            sed -i '1i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          }
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig
          git -C KernelSU log --oneline -1 || true
          # ---- 4.9 compat patch set for KernelSU v3.0.0 (old-arch) ----
          python3 - <<'EOF'
          import re

          # 1. allowlist.c/sucompat.c: linux/compiler_types.h only exists on 5.3+
          for fn in ["drivers/kernelsu/allowlist.c", "drivers/kernelsu/sucompat.c"]:
              s = open(fn).read()
              s2 = s.replace("#include <linux/compiler_types.h>\n", "")
              if s2 != s:
                  open(fn, "w").write(s2)
                  print(fn + ": removed compiler_types.h include")

          # 2. ksu.c: MODULE_IMPORT_NS macro needs 5.4+
          p = "drivers/kernelsu/ksu.c"
          s = open(p).read()
          s2 = re.sub(r'#else\s*\n(MODULE_IMPORT_NS\(VFS_internal)',
                      '#elif LINUX_VERSION_CODE >= KERNEL_VERSION(5, 4, 0)\n\\1', s)
          if s2 == s:
              s2 = re.sub(r'(?m)^(MODULE_IMPORT_NS\(VFS_internal[^;]*;)\s*$',
                          '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 4, 0)\n\\1\n#endif', s)
          if s2 != s:
              open(p, "w").write(s2)
              print("ksu.c: guarded MODULE_IMPORT_NS")

          # 3. util.c: pgtable.h (5.9+) / p4d (4.12+) / mmap_lock API (5.8+) guards
          p = "drivers/kernelsu/util.c"
          s = open(p).read()
          s2 = s.replace("#include <linux/pgtable.h>",
                         "#if __has_include(<linux/pgtable.h>)\n#include <linux/pgtable.h>\n#endif")
          s2 = s2.replace("\tp4d_t *p4d;\n",
                          "#if __has_include(<asm-generic/pgtable-nop4d.h>)\n\tp4d_t *p4d;\n#endif\n")
          s2 = s2.replace(
              "\tp4d = p4d_offset(pgd, addr);\n\tif (!p4d_present(*p4d))\n\t\tgoto out_unlock;\n\n\tpud = pud_offset(p4d, addr);\n",
              "#if __has_include(<asm-generic/pgtable-nop4d.h>)\n\tp4d = p4d_offset(pgd, addr);\n\tif (!p4d_present(*p4d))\n\t\tgoto out_unlock;\n\n\tpud = pud_offset(p4d, addr);\n#else\n\tpud = pud_offset(pgd, addr);\n#endif\n")
          s2 = s2.replace("\tif (!mmap_read_trylock(mm))\n\t\treturn false;\n",
                          "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 8, 0)\n\tif (!mmap_read_trylock(mm))\n\t\treturn false;\n#else\n\tif (!down_read_trylock(&mm->mmap_sem))\n\t\treturn false;\n#endif\n")
          s2 = s2.replace("\tmmap_read_unlock(mm);\n",
                          "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 8, 0)\n\tmmap_read_unlock(mm);\n#else\n\tup_read(&mm->mmap_sem);\n#endif\n")
          if s2 != s:
              open(p, "w").write(s2)
              print("util.c: patched for old kernels")

          # 4. pkg_observer.c: fsnotify .handle_inode_event needs 5.9+
          p = "drivers/kernelsu/pkg_observer.c"
          s = open(p).read()
          stub = ("#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)\n"
                  "int ksu_observer_init(void) { return 0; }\n"
                  "void ksu_observer_exit(void) { }\n"
                  "#else\n")
          open(p, "w").write(stub + s + "\n#endif\n")
          print("pkg_observer.c: stubbed for kernels < 5.9")
          
          # 4b. sched headers: linux/sched/signal.h & task.h split out in 4.11
          for fn in ["drivers/kernelsu/app_profile.c", "drivers/kernelsu/setuid_hook.c"]:
              s = open(fn).read()
              s2 = s.replace("#include <linux/sched/signal.h>",
                             "#if __has_include(<linux/sched/signal.h>)\n#include <linux/sched/signal.h>\n#else\n#include <linux/sched.h>\n#endif")
              if s2 != s:
                  open(fn, "w").write(s2)
                  print(fn + ": sched/signal.h guarded for old kernels")

          # 4c. app_profile.c: struct seccomp.filter_count only exists on 5.9+
          p = "drivers/kernelsu/app_profile.c"
          s = open(p).read()
          s2 = s.replace("\tatomic_set(&current->seccomp.filter_count, 0);\n",
                         "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n\tatomic_set(&current->seccomp.filter_count, 0);\n#endif\n")
          if s2 != s:
              open(p, "w").write(s2)
              print("app_profile.c: filter_count guarded for kernels < 5.9")

          # 4d. sucompat.c: linux/pgtable.h only exists on 5.9+
          p = "drivers/kernelsu/sucompat.c"
          s = open(p).read()
          s2 = s.replace("#include <linux/pgtable.h>",
                         "#if __has_include(<linux/pgtable.h>)\n#include <linux/pgtable.h>\n#endif")
          if s2 != s:
              open(p, "w").write(s2)
              print("sucompat.c: pgtable.h guarded for old kernels")

          # 4d2. linux/sched/task_stack.h missing from this 4.9 vendor tree entirely
          import glob as _glob
          for fn in _glob.glob("drivers/kernelsu/*.c"):
              s = open(fn).read()
              s2 = s.replace("#include <linux/sched/task_stack.h>",
                             "#if __has_include(<linux/sched/task_stack.h>)\n#include <linux/sched/task_stack.h>\n#endif")
              if s2 != s:
                  open(fn, "w").write(s2)
                  print(fn + ": sched/task_stack.h guarded")

          # 4e. file_wrapper.c: f_op->iopoll only exists on 5.1+
          p = "drivers/kernelsu/file_wrapper.c"
          s = open(p).read()
          s2 = s.replace("#else\nstatic int ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin) {",
                         "#elif LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\nstatic int ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin) {")
          s2 = s2.replace("\tp->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n",
                          "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n\tp->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n#endif\n")
          # 4e2. file_wrapper.c: mmap_supported_flags only exists on 4.17+
          s2 = s2.replace("#else\n\tp->ops.mmap_supported_flags = fp->f_op->mmap_supported_flags;\n#endif\n",
                          "#elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 17, 0)\n\tp->ops.mmap_supported_flags = fp->f_op->mmap_supported_flags;\n#endif\n")
          # 4e3. file_wrapper.c: f_op->remap_file_range & REMAP_FILE_DEDUP need 4.20+
          s2 = s2.replace("static loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in,\n",
                          "#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)\nstatic loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in,\n")
          s2 = s2.replace("\t\treturn orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);\n\t}\n}\n\nstatic int ksu_wrapper_fadvise(struct file *fp, loff_t off1, loff_t off2, int flags) {\n",
                          "\t\treturn orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);\n\t}\n}\n#endif\n\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 6, 0)\nstatic int ksu_wrapper_fadvise(struct file *fp, loff_t off1, loff_t off2, int flags) {\n")
          s2 = s2.replace("\tif (orig->f_op->fadvise) {\n\t\treturn orig->f_op->fadvise(orig, off1, off2, flags);\n\t}\n\treturn -EINVAL;\n}\n",
                          "\tif (orig->f_op->fadvise) {\n\t\treturn orig->f_op->fadvise(orig, off1, off2, flags);\n\t}\n\treturn -EINVAL;\n}\n#endif\n")
          # 4e4. file_wrapper.c: assignment lines for remap/fadvise guarded
          s2 = s2.replace("\tp->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;\n\tp->ops.fadvise = fp->f_op->fadvise ? ksu_wrapper_fadvise : NULL;\n",
                          "#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)\n\tp->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;\n#endif\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 6, 0)\n\tp->ops.fadvise = fp->f_op->fadvise ? ksu_wrapper_fadvise : NULL;\n#endif\n")
          if s2 != s:
              open(p, "w").write(s2)
              print("file_wrapper.c: iopoll/mmap_supported_flags/remap_file_range/fadvise guarded for old kernels")

          # 4f. seccomp_cache.c: seccomp cache机制是 5.9+ 的, refcount_t/notify 在 4.9 不存在
          p = "drivers/kernelsu/seccomp_cache.c"
          s = open(p).read()
          if not s.startswith("#if LINUX_VERSION_CODE"):
              stub = ("#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)\n"
                      "struct seccomp_filter;\n"
                      "void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr) { (void)filter; (void)nr; }\n"
                      "void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) { (void)filter; (void)nr; }\n"
                      "#else\n")
              open(p, "w").write(stub + s + "\n#endif\n")
              print("seccomp_cache.c: stubbed for kernels < 5.9")

          # NOTE: do NOT create a stub objsec.h! supercalls.c includes "objsec.h"
          # and the KSU Makefile -I paths resolve it to the kernel's own
          # security/selinux/include/objsec.h. A local stub would shadow it.

          # 4i. supercalls.c: anon_inode_getfd_secure needs 5.11+,
          #     selinux_inode() helper also absent on 4.9 (no blob infra).
          #     On <5.11 anon inodes share a singleton inode, so relabeling
          #     it would poison every anon inode -> compile the whole
          #     sid-relabel block out and use plain anon_inode_getfd.
          p = "drivers/kernelsu/supercalls.c"
          s = open(p).read()
          old1 = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n'
                  '#define getfd_secure anon_inode_create_getfd\n'
                  '#else\n'
                  '#define getfd_secure anon_inode_getfd_secure\n'
                  '#endif\n'
                  '    ret = getfd_secure("[ksu_fdwrapper]", &data->ops, data, f->f_flags, NULL);')
          new1 = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n'
                  '    ret = anon_inode_create_getfd("[ksu_fdwrapper]", &data->ops, data, f->f_flags, NULL);\n'
                  '#elif LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
                  '    ret = anon_inode_getfd_secure("[ksu_fdwrapper]", &data->ops, data, f->f_flags, NULL);\n'
                  '#else\n'
                  '    ret = anon_inode_getfd("[ksu_fdwrapper]", &data->ops, data, f->f_flags);\n'
                  '#endif')
          old2 = ('    struct inode_security_struct *sec = selinux_inode(wrapper_inode);\n'
                  '    if (sec) {\n'
                  '        sec->sid = ksu_file_sid;\n'
                  '    }')
          new2 = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
                  '    struct inode_security_struct *sec = selinux_inode(wrapper_inode);\n'
                  '    if (sec) {\n'
                  '        sec->sid = ksu_file_sid;\n'
                  '    }\n'
                  '#endif')
          changed = False
          if old1 in s:
              s = s.replace(old1, new1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2)
              changed = True
          if changed:
              open(p, "w").write(s)
              print("supercalls.c: fd-wrapper API guarded for kernels < 5.11")
          # 4j. selinux/: v3.0.0 selinux subdir uses 5.6+ blob APIs
          #     (selinux_state/selinux_cred). Replace it wholesale with the
          #     official v0.9.5 implementation which is natively compatible
          #     down to 4.9, then append the 3 v3.0.0-only entry points
          #     written in a 4.9-safe style (cred->security direct access).
          import urllib.request
          sel_dir = "drivers/kernelsu/selinux"
          for f in ["selinux.c", "selinux.h", "rules.c", "sepolicy.c", "sepolicy.h"]:
              urllib.request.urlretrieve(
                  "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/selinux/" + f,
                  sel_dir + "/" + f)
              print("selinux/" + f + ": replaced with v0.9.5")
          p = sel_dir + "/selinux.h"
          s = open(p).read()
          s = s.replace('#include "linux/version.h"',
                        '#include "linux/version.h"\n#include "linux/cred.h"')
          hdecl = """
          bool is_task_ksu_domain(const struct cred* cred);
          bool is_init(const struct cred* cred);
          u32 ksu_get_ksu_file_sid();

          int handle_sepolicy(unsigned long arg3, void __user *arg4);

          """
          idx = s.rstrip().rfind("#endif")
          s = s[:idx] + hdecl + s[idx:]
          open(p, "w").write(s)
          print("selinux/selinux.h: v3.0.0 entry point declarations added")

          # 4j3. v0.9.5 sepolicy.c includes ../kernel_compat.h which only
          #      exists in the v0.9.5 tree; v3.0.0 tree has no such file and
          #      its symbols are unused on 4.9 -> guard with __has_include.
          p = sel_dir + "/sepolicy.c"
          s = open(p).read()
          if '#include "../kernel_compat.h"' in s:
              s = s.replace('#include "../kernel_compat.h"',
                            '#if __has_include("../kernel_compat.h")\n#include "../kernel_compat.h"\n#endif')
              open(p, "w").write(s)
              print("selinux/sepolicy.c: kernel_compat.h include guarded")

          # 4j4. rules.c: on <5.10 (no KSU_COMPAT_USE_SELINUX_STATE) the
          #      reset_avc_cache() first branch calls avc_ss_reset(0), whose
          #      prototype lives in the kernel's own
          #      security/selinux/include/avc_ss.h (resolved via the selinux
          #      Makefile -I path). Include it explicitly.
          p = sel_dir + "/rules.c"
          s = open(p).read()
          if '#include "ss/services.h"' in s and "#include \"avc_ss.h\"" not in s:
              s = s.replace('#include "ss/services.h"',
                            '#include "ss/services.h"\n\n#ifndef KSU_COMPAT_USE_SELINUX_STATE\n#include "avc_ss.h"\n#endif')
              open(p, "w").write(s)
              print("selinux/rules.c: avc_ss.h include added for <5.10")

          p = sel_dir + "/selinux.c"
          s = open(p).read()
          s = s.replace('#include "objsec.h"',
                        '#include "objsec.h"\n#include <linux/security.h>')
          addition = """
          bool is_task_ksu_domain(const struct cred* cred)
          {
              char *domain;
              u32 seclen;
              bool result;
              const struct task_security_struct *tsec;
              int err;
              if (!cred) {
                  return false;
              }
              tsec = (const struct task_security_struct *)cred->security;
              if (!tsec) {
                  return false;
              }
              err = security_secid_to_secctx(tsec->sid, &domain, &seclen);
              if (err) {
                  return false;
              }
              result = strncmp(KERNEL_SU_DOMAIN, domain, seclen) == 0;
              security_release_secctx(domain, seclen);
              return result;
          }

          bool is_init(const struct cred* cred)
          {
              char *domain;
              u32 seclen;
              bool result;
              const struct task_security_struct *tsec;
              int err;
              if (!cred) {
                  return false;
              }
              tsec = (const struct task_security_struct *)cred->security;
              if (!tsec) {
                  return false;
              }
              err = security_secid_to_secctx(tsec->sid, &domain, &seclen);
              if (err) {
                  return false;
              }
              result = strncmp("u:r:init:s0", domain, seclen) == 0;
              security_release_secctx(domain, seclen);
              return result;
          }

          u32 ksu_get_ksu_file_sid()
          {
              u32 ksu_file_sid = 0;
              int err = security_secctx_to_secid("u:object_r:ksu_file:s0",
                                 strlen("u:object_r:ksu_file:s0"), &ksu_file_sid);
              if (err) {
                  pr_info("get ksufile sid err %d\\n", err);
              }
              return ksu_file_sid;
          }
          """
          s = s + addition
          open(p, "w").write(s)
          print("selinux/selinux.c: v3.0.0 entry points appended (4.9-safe style)")

          # 4j2. is_zygote signature: v0.9.5 declares "void *", but v3.0.0
          #      callers pass "const struct cred *" (-Werror rejects
          #      discarding qualifiers). Constify both decl and def.
          p = sel_dir + "/selinux.h"
          s = open(p).read()
          if "bool is_zygote(void *cred);" in s:
              s = s.replace("bool is_zygote(void *cred);",
                            "bool is_zygote(const void *cred);")
              open(p, "w").write(s)
              print("selinux/selinux.h: is_zygote constified")
          p = sel_dir + "/selinux.c"
          s = open(p).read()
          if "bool is_zygote(void *sec)" in s:
              s = s.replace("bool is_zygote(void *sec)",
                            "bool is_zygote(const void *sec)")
              open(p, "w").write(s)
              print("selinux/selinux.c: is_zygote constified")

          p = "drivers/kernelsu/seccomp_cache.c"
          s = open(p).read()
          s2 = s.replace("#include <linux/sched/task.h>",
                         "#if __has_include(<linux/sched/task.h>)\n#include <linux/sched/task.h>\n#endif")
          if s2 != s:
              open(p, "w").write(s2)
              print("seccomp_cache.c: sched/task.h guarded for old kernels")

          # 4k. manual hooks: this kernel tree pre-integrates CONFIG_KSU call
          #     sites (fs/exec.c, fs/read_write.c, kernel/reboot.c) expecting
          #     global ksu_handle_execveat / ksu_handle_sys_read /
          #     ksu_handle_sys_reboot. v3.0.0 old-arch implements the same
          #     logic via kprobes, so add thin wrappers in ksud.c:
          #     - execveat: forward to ksu_handle_execveat_ksud (void* argv /
          #       envp are really struct user_arg_ptr*, already defined above
          #       in ksud.c with the same layout as fs/exec.c)
          #     - sys_read: de-static the existing identical implementation
          #     - sys_reboot: no-op (v3.0.0 has no reboot hook; kernel patch
          #       ignores the return value)
          p = "drivers/kernelsu/ksud.c"
          s = open(p).read()
          if "static int ksu_handle_sys_read(" in s:
              s = s.replace("static int ksu_handle_sys_read(",
                            "int ksu_handle_sys_read(")
          if "int ksu_handle_execveat(int *fd" not in s:
              wrapper = (
                  "int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                  "                        void *argv, void *envp, int *flags)\n"
                  "{\n"
                  "    (void)flags;\n"
                  "    return ksu_handle_execveat_ksud(fd, filename_ptr,\n"
                  "                                    (struct user_arg_ptr *)argv,\n"
                  "                                    (struct user_arg_ptr *)envp, flags);\n"
                  "}\n"
                  "\n"
                  "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n"
                  "                          void __user **arg)\n"
                  "{\n"
                  "    (void)magic1; (void)magic2; (void)cmd; (void)arg;\n"
                  "    return 0;\n"
                  "}\n")
              s = s + wrapper
          open(p, "w").write(s)
          print("ksud.c: manual hook wrappers added (execveat fwd, sys_read de-static, reboot noop)")

          # 4h. setuid_hook.c: force_sig takes (sig, task) two args before 5.2
          p = "drivers/kernelsu/setuid_hook.c"
          s = open(p).read()
          s2 = s.replace("force_sig(SIGKILL);", "ksu_force_sig(SIGKILL);")
          if s2 != s:
              open(p, "w").write(s2)
              print("setuid_hook.c: force_sig routed through ksu_force_sig wrapper")

          # 5. compat header: kernel_read/write (4.14), TWA_RESUME & strncpy_from_user_nofault (5.9), ksys_close (5.0), force_sig (5.2)
          compat = "#ifndef __KSU_COMPAT_49_H\n#define __KSU_COMPAT_49_H\n"
          compat += "#include <linux/version.h>\n#include <linux/fs.h>\n"
          compat += "#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 14, 0)\n"
          compat += "static inline int ksu_kernel_read49(struct file *f, void *buf, size_t count, loff_t *pos)\n{\n"
          compat += "    int r = kernel_read(f, *pos, (char *)buf, count);\n    if (r > 0)\n        *pos += r;\n    return r;\n}\n"
          compat += "static inline ssize_t ksu_kernel_write49(struct file *f, const void *buf, size_t count, loff_t *pos)\n{\n"
          compat += "    ssize_t r = kernel_write(f, (const char *)buf, count, *pos);\n    if (r > 0)\n        *pos += r;\n    return r;\n}\n"
          compat += "#endif\n"
          compat += "#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 16, 0)\n"
          compat += "#define __poll_t unsigned int\n"
          compat += "#endif\n"
          compat += "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)\n"
          compat += "#include <linux/uaccess.h>\n"
          compat += "#define TWA_RESUME true\n"
          compat += "#define strncpy_from_user_nofault(dst, src, count) strncpy_from_unsafe(dst, src, count)\n"
          compat += "#endif\n"
          compat += "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)\n"
          compat += "#include <linux/syscalls.h>\n"
          compat += "#define ksys_close(fd) sys_close(fd)\n"
          compat += "#endif\n"
          compat += "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 2, 0)\n"
          compat += "#define ksu_force_sig(sig) force_sig(sig, current)\n"
          compat += "#else\n"
          compat += "#define ksu_force_sig(sig) force_sig(sig)\n"
          compat += "#endif\n#endif\n"
          open("drivers/kernelsu/ksu_compat_49.h", "w").write(compat)
          import glob
          import os
          for fn in glob.glob("drivers/kernelsu/*.c"):
              s = open(fn).read()
              if "ksu_compat_49.h" not in s:
                  s = '#include "ksu_compat_49.h"\n' + s
              if os.path.basename(fn) in ("apk_sign.c", "throne_tracker.c", "allowlist.c"):
                  s = s.replace("kernel_read(fp", "ksu_kernel_read49(fp")
                  s = s.replace("kernel_write(fp", "ksu_kernel_write49(fp")
              open(fn, "w").write(s)
          print("compat header prepended to all kernelsu .c files; kernel_read/write rewrite applied")
          EOF
          echo "=== patched files summary ==="
          grep -l "ksu_compat_49" drivers/kernelsu/*.c drivers/kernelsu/*.h 2>/dev/null || true

      - name: Make defconfig
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 ${DEFCONFIG}
          echo "=== verify KSU survived defconfig ==="
          if ! grep -q "^CONFIG_KSU=y" out/.config; then
            echo "::error::CONFIG_KSU was dropped by defconfig! Check KPROBES/EXT4_FS deps and Kconfig sourcing."
            grep -E "KSU|KPROBES|EXT4_FS=" out/.config || true
            exit 1
          fi
          if ! grep -q "^CONFIG_KPROBES=y" out/.config; then
            echo "::error::CONFIG_KPROBES was dropped by defconfig!"
            exit 1
          fi
          echo "OK: CONFIG_KSU=y and CONFIG_KPROBES=y are in out/.config"
          grep -E "CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_LOCALVERSION=" out/.config

      - name: Build Image.gz-dtb
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:/opt/cross/bin:$PATH"
          export KBUILD_BUILD_USER=dipper
          export KBUILD_BUILD_HOST=kernelsu-build
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LLVM=1 ${IAS_FLAG} \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            Image.gz-dtb
          ls -la out/arch/arm64/boot/

      - name: "Fallback: append dtb manually if needed"
        if: hashFiles('kernel/out/arch/arm64/boot/Image.gz-dtb') == ''
        run: |
          cd kernel/out/arch/arm64/boot
          DTB=$(find . -name "*.dtb" | grep -i -m1 "dipper" || find . -name "*.dtb" | grep -i -m1 "sdm845" || find . -name "*.dtb" | head -1)
          echo "Using DTB: $DTB"
          cat Image.gz "$DTB" > Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/anykernel.sh.patch
          cp anykernel.sh ak3/anykernel.sh
          # 适配老 MIUI (A10 底包): 取消 Android 版本门槛
          sed -i 's/^supported.versions=.*/supported.versions=/' ak3/anykernel.sh
          sed -i "s/^kernel.string=.*/kernel.string=${KERNEL_STRING}/" ak3/anykernel.sh
          grep -E "kernel.string|supported.versions|device.name" ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          cd ak3
          zip -r9 "../NGK_dipper_KernelSU_${{ github.run_number }}_$(date +%Y%m%d).zip" *
          cd ..
          ls -la *.zip
          unzip -l *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGK_dipper_KernelSU_${{ github.run_number }}
          path: NGK_dipper_KernelSU_*.zip
          if-no-files-found: error

      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls NGK_dipper_KernelSU_*.zip | head -1)
          gh release create "dipper-ksu-${{ github.run_number }}" \
            --title "NGK dipper + KernelSU #${{ github.run_number }}" \
            --notes "Base: ${KERNEL_REPO} @ ${KERNEL_BRANCH} / KernelSU: tiann/KernelSU ${{ github.event.inputs.ksu_ref }} (old-arch, kprobes) / SUSFS disabled / supported.versions check disabled (any MIUI). Manager: use a KernelSU manager matching the kernel version, e.g. official releases on tiann/KernelSU." \
            "$ZIP"

