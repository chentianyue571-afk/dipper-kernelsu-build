name: Build dipper kernel with official KernelSU (4.9 compatible)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel source branch/commit (mansiaer/NGK_android_kernel_xiaomi_sdm845)"
        default: "susfs"
        required: false
      ksu_ref:
        description: "KernelSU tag (old-arch only: v3.0.0/v2.0.0/v1.0.0; main is new-arch and CANNOT build on 4.9)"
        default: "v3.0.0"
        required: false
      create_release:
        description: "Create release after build"
        default: "true"
        required: false

permissions:
  contents: write

env:
  KERNEL_REPO: mansiaer/NGK_android_kernel_xiaomi_sdm845
  CLANG_URL: >-
    https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/42d2c090c14c9c7f4dfd365ae551e2b959dc775c/clang-r584948b.tar.gz
  DEFCONFIG: nh-dipper_defconfig

jobs:
  build:
    name: Build dipper + KernelSU
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout kernel source
        run: |
          git clone --depth=1 --branch "${{ github.event.inputs.kernel_ref }}" \
            "https://github.com/${KERNEL_REPO}.git" kernel
          cd kernel
          echo "kernel HEAD = $(git rev-parse HEAD)"
          echo "=== defconfig KSU/KPROBES before patch ==="
          grep -E "CONFIG_KPROBES|CONFIG_KSU|CONFIG_EXT4_FS=" arch/arm64/configs/${DEFCONFIG} || true

      - name: Patch defconfig (enable KPROBES, required by KSU)
        run: |
          cd kernel
          {
            echo ""
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_LOCALVERSION=\"-NGK-KSU\""
          } >> arch/arm64/configs/${DEFCONFIG}
          echo "=== defconfig after patch ==="
          grep -E "CONFIG_KPROBES=|CONFIG_KSU=|CONFIG_LOCALVERSION=" arch/arm64/configs/${DEFCONFIG}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev python3 lld zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache clang toolchain
        id: clang
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-r584948b

      - name: Download clang
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir clang
          curl -L --fail --retry 3 "${CLANG_URL}" -o clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz
          ./clang/bin/clang --version

      - name: Integrate official KernelSU (old-arch tag, 4.9 compatible)
        run: |
          cd kernel
          KSU_REF="${{ github.event.inputs.ksu_ref }}"
          curl -LSs --fail --retry 3 \
            "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_REF}/kernel/setup.sh" \
            -o setup_ksu.sh
          sh setup_ksu.sh "${KSU_REF}"
          echo "=== verify integration ==="
          test -f KernelSU/kernel/Makefile || test -f KernelSU/kernel/Kbuild || { echo "::error::KernelSU source not present"; exit 1; }
          grep -q "kernelsu" drivers/Makefile || { echo "::error::drivers/Makefile not patched by setup.sh"; exit 1; }
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || {
            echo "Kconfig entry missing, adding it manually"
            sed -i '1i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          }
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig
          git -C KernelSU log --oneline -1 || true

      - name: Make defconfig
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 ${DEFCONFIG}
          echo "=== verify KSU survived defconfig ==="
          if ! grep -q "^CONFIG_KSU=y" out/.config; then
            echo "::error::CONFIG_KSU was dropped by defconfig! Check KPROBES/EXT4_FS deps and Kconfig sourcing."
            grep -E "KSU|KPROBES|EXT4_FS=" out/.config || true
            exit 1
          fi
          if ! grep -q "^CONFIG_KPROBES=y" out/.config; then
            echo "::error::CONFIG_KPROBES was dropped by defconfig!"
            exit 1
          fi
          echo "OK: CONFIG_KSU=y and CONFIG_KPROBES=y are in out/.config"
          grep -E "CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_LOCALVERSION=" out/.config

      - name: Build Image.gz-dtb
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER=dipper
          export KBUILD_BUILD_HOST=kernelsu-build
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            Image.gz-dtb
          ls -la out/arch/arm64/boot/

      - name: "Fallback: append dtb manually if needed"
        if: hashFiles('kernel/out/arch/arm64/boot/Image.gz-dtb') == ''
        run: |
          cd kernel/out/arch/arm64/boot
          DTB=$(find . -name "*.dtb" | grep -i -m1 "dipper" || find . -name "*.dtb" | grep -i -m1 "sdm845" || find . -name "*.dtb" | head -1)
          echo "Using DTB: $DTB"
          cat Image.gz "$DTB" > Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/anykernel.sh.patch
          cp anykernel.sh ak3/anykernel.sh
          # 适配老 MIUI (A10 底包): 取消 Android 版本门槛
          sed -i 's/^supported.versions=.*/supported.versions=/' ak3/anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=NGK dipper + official KernelSU (MIUI any)/' ak3/anykernel.sh
          grep -E "kernel.string|supported.versions|device.name" ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          cd ak3
          zip -r9 "../NGK_dipper_KernelSU_${{ github.run_number }}_$(date +%Y%m%d).zip" *
          cd ..
          ls -la *.zip
          unzip -l *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGK_dipper_KernelSU_${{ github.run_number }}
          path: NGK_dipper_KernelSU_*.zip
          if-no-files-found: error

      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls NGK_dipper_KernelSU_*.zip | head -1)
          gh release create "dipper-ksu-${{ github.run_number }}" \
            --title "NGK dipper + KernelSU #${{ github.run_number }}" \
            --notes "Base: NGK dipper (mansiaer fork, ${{ github.event.inputs.kernel_ref }} branch) / KernelSU: tiann/KernelSU ${{ github.event.inputs.ksu_ref }} (old-arch, kprobes) / SUSFS disabled / supported.versions check disabled (any MIUI). Manager: use a KernelSU manager matching the kernel version, e.g. official releases on tiann/KernelSU." \
            "$ZIP"
